<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="{{ url_for('manifest') }}">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<title>{% block title %}Счета и КП{% endblock %}</title>
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">📋 Счета и КП</a>
  <div class="topbar-actions">
    <a class="btn btn-topbar" href="{{ url_for('finance.calendar') }}">💰 Деньги</a>
    <a class="btn btn-primary" href="{{ url_for('invoice_new') }}">+ Добавить</a>
  </div>
</header>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flashes">
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    </div>
  {% endif %}
{% endwith %}
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
