{% extends "base.html" %}
{% block title %}{{ 'Изменить' if invoice else 'Добавить' }} — Счета и КП{% endblock %}
{% block content %}

<h1>{{ 'Изменить запись' if invoice else 'Новый счёт / КП' }}</h1>

<form class="form" method="post" enctype="multipart/form-data">

  <label>Тип документа</label>
  <div class="seg">
    {% for k, v in DOC_TYPES.items() %}
    <label class="seg-item">
      <input type="radio" name="doc_type" value="{{ k }}"
        {% if (invoice and invoice.doc_type == k) or (not invoice and k == 'invoice') %}checked{% endif %}>
      <span>{{ v }}</span>
    </label>
    {% endfor %}
  </div>

  <label>Проект</label>
  <select name="project_id">
    <option value="">— выберите проект —</option>
    {% for p in projects %}
      <option value="{{ p.id }}" {% if invoice and invoice.project_id == p.id %}selected{% endif %}>{{ p.name }}</option>
    {% endfor %}
  </select>
  <input type="text" name="new_project" placeholder="…или впишите новый проект">

  <label>Номер счёта / КП</label>
  <input type="text" name="number" value="{{ invoice.number if invoice else '' }}" placeholder="Например: 154 от 10.07.2026">

  <label>Поставщик</label>
  <select name="supplier_id" id="supplier_select">
    <option value="" data-contacts="">— выберите поставщика —</option>
    {% for s in suppliers %}
      <option value="{{ s.id }}" data-contacts="{{ s.contacts }}" {% if invoice and invoice.supplier_name == s.name %}selected{% endif %}>{{ s.name }}</option>
    {% endfor %}
  </select>
  <input type="text" name="new_supplier" placeholder="…или впишите нового поставщика">

  <label>Контакты поставщика</label>
  <textarea name="supplier_contacts" id="supplier_contacts" rows="2" placeholder="Телефон, имя менеджера, email">{{ invoice.supplier_contacts if invoice else '' }}</textarea>

  <label>Откуда и как забирать</label>
  <textarea name="pickup_info" rows="2" placeholder="Адрес склада, режим работы, самовывоз/доставка, пропуск и т.п.">{{ invoice.pickup_info if invoice else '' }}</textarea>

  <div class="row2">
    <div>
      <label>Сумма, ₽ (с НДС)</label>
      <input type="text" inputmode="decimal" name="amount" value="{{ invoice.amount if invoice else '' }}" placeholder="0,00" required>
    </div>
    <div>
      <label>НДС</label>
      <select name="vat_rate">
        {% for r in VAT_RATES %}
          <option value="{{ r }}" {% if (invoice and invoice.vat_rate == r) or (not invoice and r == '20') %}selected{% endif %}>{{ VAT_LABELS[r] }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row2">
    <div>
      <label>Оплатить до</label>
      <input type="date" name="due_date" value="{{ invoice.due_date or '' if invoice else today }}">
    </div>
    <div>
      <label>Группа бюджета</label>
      <select name="budget_group_id" id="budget_group_select">
        <option value="">— не привязан —</option>
        {% for g in groups %}
          <option value="{{ g.id }}" data-project="{{ g.project_id }}"
            {% if invoice and invoice.budget_group_id == g.id %}selected{% endif %}>{{ g.project_name }} · {{ g.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <label class="check-label"><input type="checkbox" name="is_critical"
    {% if invoice and invoice.is_critical %}checked{% endif %}> Критичный — без него встанет этап</label>

  <label class="check-label"><input type="checkbox" name="in_plan"
    {% if invoice and invoice.in_plan %}checked{% endif %}> Учитывать в расчёте
    <small>— для КП: отметьте одно, которое планируете оплатить (из нескольких на один материал/работу)</small></label>

  <label>Комментарий</label>
  <textarea name="comment" rows="2">{{ invoice.comment if invoice else '' }}</textarea>

  <label>Файлы (фото или PDF счёта)</label>
  <input class="file-input" type="file" name="files" multiple accept="image/*,.pdf,.xls,.xlsx,.doc,.docx">

  <div class="form-actions">
    <button class="btn btn-primary btn-big" type="submit">Сохранить</button>
    <a class="btn btn-big" href="{{ url_for('invoice_detail', invoice_id=invoice.id) if invoice else url_for('index') }}">Отмена</a>
  </div>
</form>

<script>
(function () {
  var sel = document.getElementById('supplier_select');
  var box = document.getElementById('supplier_contacts');
  var newInput = document.querySelector('input[name="new_supplier"]');
  if (sel && box) {
    sel.addEventListener('change', function () {
      var opt = sel.options[sel.selectedIndex];
      var c = opt.getAttribute('data-contacts') || '';
      if (c) box.value = c;            // подставляем сохранённые контакты
      if (sel.value && newInput) newInput.value = '';
    });
  }
  // группы бюджета: показываем только группы выбранного проекта
  var proj = document.querySelector('select[name="project_id"]');
  var grp = document.getElementById('budget_group_select');
  function filterGroups() {
    if (!proj || !grp) return;
    var pid = proj.value;
    for (var i = 0; i < grp.options.length; i++) {
      var o = grp.options[i];
      var gp = o.getAttribute('data-project');
      var hide = !!(gp && pid && gp !== pid);
      o.hidden = hide;
      if (hide && o.selected) grp.value = '';
    }
  }
  if (proj && grp) {
    proj.addEventListener('change', filterGroups);
    filterGroups();
  }
})();
</script>

{% endblock %}
